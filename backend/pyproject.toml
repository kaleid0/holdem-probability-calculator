[project]
name = "poker-calculator"
version = "0.2.0"
description = "Texas Hold'em equity and strategy analysis service"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "phevaluator>=0.5,<1",
  "editables>=0.3,<0.4", # Required by exact editable import hook on Python 3.11.
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# ASCII import hook avoids Python 3.11's locale-decoded .pth paths on Windows.
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "phevaluator.*"
ignore_missing_imports = true
